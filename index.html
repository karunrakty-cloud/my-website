<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--ac:#ff7eb6}
*{-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:#08080f;color:#f4f4f8;min-height:100dvh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.5;z-index:0;transition:background 1s;animation:fl 16s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.13);box-shadow:0 14px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
button{font:inherit;color:inherit;cursor:pointer;user-select:none;transition:transform .15s cubic-bezier(.3,1.4,.6,1),background .25s,border-color .25s}
button:active{transform:scale(.93)}
#clockWrap{padding:2px;border-radius:999px;background:conic-gradient(from var(--a),#ffc4dc,#ffe0b8,#fff6b8,#c4f5d2,#b8e2ff,#d4c8ff,#ffc4dc);animation:spin 5s linear infinite;opacity:.95}
@keyframes spin{to{--a:360deg}}
#clock{background:#0d0d18;border-radius:999px;padding:7px 14px;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.chip{padding:11px 15px;border-radius:18px;font-size:15px;min-height:46px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.chip.on{background:color-mix(in srgb,var(--c) 28%,transparent);border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent)}
.card{position:relative;border-radius:30px;padding:32px 24px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.45),0 0 60px color-mix(in srgb,var(--ac) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
#q{font-size:clamp(20px,5vw,26px);line-height:1.6;font-weight:600;display:inline-block;transition:filter .3s ease,transform .3s ease,opacity .3s ease}
#q.slot{filter:blur(6px);opacity:.65;animation:zoom .16s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(.93)}to{transform:scale(1.07)}}
.go{background:linear-gradient(135deg,var(--ac),#7b6bff);color:#0b0b14;font-weight:700;transition:background .6s,transform .15s}
.ib{width:100%;aspect-ratio:1;max-height:56px;border-radius:18px;font-size:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);display:grid;place-items:center}
.ib.on{background:color-mix(in srgb,var(--ac) 30%,transparent);border-color:var(--ac)}
.hp{position:absolute;left:50%;top:-6px;font-size:44px;pointer-events:none;z-index:6;opacity:0;animation:hpop 1.4s ease-out forwards}
@keyframes hpop{0%{transform:translate(-50%,10px) scale(0);opacity:0}22%{transform:translate(-50%,-28px) scale(1.35) rotate(-8deg);opacity:1}38%{transform:translate(-50%,-32px) scale(1.1) rotate(8deg)}55%{transform:translate(-50%,-32px) scale(1.2) rotate(-4deg)}100%{transform:translate(-50%,-72px) scale(1);opacity:0}}
.sh{position:absolute;left:50%;top:8px;font-size:16px;pointer-events:none;z-index:6;opacity:0;animation:shard .9s ease-out .3s forwards}
@keyframes shard{0%{transform:translate(-50%,0) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));transform:translate(-50%,-30px) scale(.95);opacity:0;z-index:50;padding:12px 20px;border-radius:999px;font-size:14px;transition:all .4s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
dialog{border:none;border-radius:26px;padding:20px;max-width:92vw;width:400px;color:#f4f4f8;background:rgba(24,24,38,.9);backdrop-filter:blur(24px)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog input{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:14px;margin:10px 0}
.pb{padding:14px;border-radius:16px;font-weight:600;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="blob" style="width:340px;height:340px;background:var(--ac);top:-90px;left:-70px"></div>
<div class="blob" style="width:300px;height:300px;background:#6d5dfc;bottom:-60px;right:-50px;animation-delay:-6s"></div>

<header class="fixed z-20 left-0 right-0 flex items-start justify-between px-3" style="top:max(12px,env(safe-area-inset-top))">
  <div id="dev" class="glass rounded-full px-4 py-2 text-sm">…</div>
  <div id="clockWrap"><div id="clock">--:--:--</div></div>
</header>

<div id="toast" class="glass"></div>

<div class="relative z-10 flex items-center justify-center px-4" style="min-height:100dvh;padding:84px 16px 72px">
 <main class="w-full" style="max-width:560px">
  <h1 class="text-center text-3xl md:text-4xl font-bold">✨ Quote Vibe AI</h1>
  <p class="text-center opacity-60 text-sm mt-1 mb-5">เลือกอารมณ์ แล้วสุ่มคำคมกวนๆ</p>
  <div id="moods" class="flex flex-wrap gap-2 justify-center mb-5"></div>

  <div class="card glass" id="card">
    <div id="tag" class="text-xs opacity-70 mb-3"></div>
    <div id="q">กดปุ่มสุ่มเพื่อเริ่มเลย 🎲</div>
  </div>

  <button id="go" class="go glass w-full mt-4 rounded-2xl text-lg" style="min-height:56px;border:none">🎲 สุ่มคำคม</button>

  <div class="grid grid-cols-6 gap-2 mt-3">
    <button class="ib" id="copy" title="คัดลอก">📋</button>
    <button class="ib" id="fav" title="บันทึกโปรด">🤍</button>
    <button class="ib" id="tts" title="อ่านออกเสียง">🔊</button>
    <button class="ib" id="story" title="การ์ด Story">🖼️</button>
    <button class="ib" id="line" title="แชร์ LINE">💬</button>
    <button class="ib" id="tw" title="แชร์ X"><b>𝕏</b></button>
  </div>
  <div class="flex gap-2 mt-2">
    <button class="pb flex-1" id="favs">⭐ คำคมโปรด (<span id="fc">0</span>)</button>
    <button class="pb" id="gear" title="ตั้งค่า API key">⚙️</button>
  </div>
 </main>
</div>

<footer id="foot" class="fixed left-0 right-0 text-center text-xs opacity-60 z-10 pointer-events-none" style="bottom:max(16px,env(safe-area-inset-bottom))"></footer>

<dialog id="dKey">
  <b>Groq API key</b>
  <p class="text-xs opacity-70 mt-1">เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น เว้นว่างเพื่อใช้คำคมสำรองออฟไลน์</p>
  <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
  <div class="flex gap-2"><button class="pb flex-1" onclick="dKey.close()">ยกเลิก</button><button class="pb flex-1" id="saveKey" style="background:var(--ac);color:#0b0b14">บันทึก</button></div>
</dialog>

<dialog id="dFav">
  <b>⭐ คำคมโปรดของฉัน</b>
  <div id="favList" class="mt-3 space-y-2 overflow-y-auto" style="max-height:55vh"></div>
  <button class="pb w-full mt-3" onclick="dFav.close()">ปิด</button>
</dialog>

<dialog id="dStory">
  <b>🖼️ การ์ด Story</b>
  <canvas id="cv" width="1080" height="1920" class="w-full rounded-2xl mt-3" style="max-height:60vh;object-fit:contain"></canvas>
  <div class="flex gap-2 mt-3"><button class="pb flex-1" onclick="dStory.close()">ปิด</button><button class="pb flex-1" id="dl" style="background:var(--ac);color:#0b0b14">⬇️ ดาวน์โหลด PNG</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const MOODS={
 love:{n:"💖 คนมีแฟน",c:"#ff7eb6",p:"คำคมคลั่งรักปนกวน แซ่บๆ ฮาๆ สำหรับคนมีแฟน"},
 broken:{n:"💔 อกหัก",c:"#8ab4ff",p:"คำคมดึงสติสายสตรอง เจ็บแต่ตลก สำหรับคนอกหัก"},
 sad:{n:"🌧️ คนเศร้า",c:"#7fd6c2",p:"คำคมฮีลใจแบบไม่ดราม่า เน้นให้ยิ้มได้ สำหรับคนเศร้าหรือท้อแท้"},
 power:{n:"🔥 ขอกำลังใจ",c:"#ffb86b",p:"คำคมปลุกพลังชีวิตด้วยมุกตลกปั่นๆ ให้กำลังใจ"},
 random:{n:"🎲 สุ่มมั่ว",c:"#c4a1ff",p:"คำคมกวนๆ อารมณ์ไหนก็ได้ คาดเดาไม่ได้ ฮาๆ"}
};
const MOCK={
 love:["ไม่ได้ขี้หึงหรอก แค่ขี้หวง… แล้วก็ขี้งอน… แล้วก็ขี้เหงาเวลาไม่เจอเธอ","แฟนฉันไม่ใช่สเปคใคร แต่เป็นสเปคชีวิตฉันเลยล่ะ","เธอคือไวไฟของฉัน ห่างนิดเดียวก็หลุดแล้ว","รักเธอเท่าเงินเดือนวันที่ออก คือรอทุกวัน ใจจดจ่อ","ถ้าเธอเป็นโปรโมชั่น ฉันก็ยอมสมัครแบบไม่อ่านเงื่อนไข","ฉันไม่ได้ขี้เกียจนะ แค่ขี้เกียจทุกอย่าง ยกเว้นคิดถึงเธอ","แฟนบอกให้ลดความอ้วน ฉันเลยลดความเกรงใจแทน","เธอคือเมนูโปรด ต่อให้สั่งทุกวันก็ไม่เบื่อ ถึงจะแพงก็เถอะ","รักเธอมากกว่าตอนที่ได้นอนวันหยุด และนั่นคือเรื่องใหญ่มาก","ขอเป็นแบตสำรองของเธอได้ไหม จะได้ชาร์จใจให้ทุกวัน","แฟนทักมาตอนตีสาม ง่วงก็ตอบ เพราะมือถือคือหัวใจ","ใครว่าความรักไม่มีเหตุผล ฉันมีเหตุผลเดียวคือเธอนั่นแหละ"],

 sad:["วันนี้แย่ไม่เป็นไร พรุ่งนี้ยังมีกาแฟให้ดื่มอีกแก้ว","ช้าบ้างไม่เป็นไร เต่ายังไปถึงบ้านตัวเองได้เลย","ท้อได้ พักได้ แต่อย่าลืมว่าเราผ่านวันที่แย่กว่านี้มาแล้ว","ร้องไห้เสร็จแล้วไปกินของอร่อย ชีวิตยังมีให้ลองอีกเยอะ","เมฆครึ้มแค่ไหน ดวงอาทิตย์ก็ยังอยู่ข้างหลัง แค่ขี้อายนิดหน่อย","เหนื่อยก็นอน ฝนตกก็ห่มผ้า ชีวิตไม่ต้องรีบขนาดนั้น","งานเยอะก็ทำทีละอย่าง กองดองยังไม่ลุกขึ้นมาไล่เราหรอก","เงินหมดก็ยังมีข้าวไข่เจียวที่รักเราอยู่เสมอ","วันที่ไม่มีใครเข้าใจ ก็ยังมีเพลงโปรดที่ไม่เคยตัดสิน","ไม่ต้องเก่งทุกวันก็ได้ บางวันแค่หายใจก็เก่งแล้ว","ใจยังเศร้าอยู่ ก็ให้มันเศร้าไป แต่ขอให้ท้องกินข้าวด้วยนะ","ชีวิตเหมือนไวไฟ บางทีสัญญาณอ่อน แต่รีสตาร์ทแล้วก็ดีขึ้นได้"],

};
MOCK.random=[].concat(...Object.values(MOCK));
let mood="love",busy=false,last="",cur="";

/* storage helpers */
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
let favs=[];try{favs=JSON.parse(ls.get("qv_favs")||"[]")}catch{}

/* moods */
function setAccent(c){document.documentElement.style.setProperty("--ac",c)}
Object.entries(MOODS).forEach(([k,v])=>{
 const b=document.createElement("button");b.className="chip"+(k===mood?" on":"");b.style.setProperty("--c",v.c);b.textContent=v.n;
 b.onclick=()=>{mood=k;document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));b.classList.add("on");setAccent(v.c);$("tag").textContent=v.n;roll()};
 $("moods").appendChild(b);
});
$("tag").textContent=MOODS[mood].n;setAccent(MOODS[mood].c);

/* device */
function dev(){
 const ua=navigator.userAgent,w=innerWidth;
 $("dev").textContent=/iPad|Tablet/i.test(ua)||(w>=700&&w<1024&&/Mobi|Android/i.test(ua))?"📟 แท็บเล็ต":(/Mobi|Android|iPhone/i.test(ua)||w<700)?"📱 มือถือ":"💻 คอมพิวเตอร์";
}
dev();addEventListener("resize",dev);

/* clock + Thai date */
function tick(){
 const d=new Date();
 $("clock").innerHTML=d.toLocaleTimeString("th-TH",{timeZone:"Asia/Bangkok",hour12:false})+' <small style="opacity:.55">ICT</small>';
 $("foot").textContent=d.toLocaleDateString("th-TH-u-ca-buddhist",{timeZone:"Asia/Bangkok",weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
tick();setInterval(tick,1000);

/* toast */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900)}

/* AI + anti-repeat */
const THEMES=["เรื่องเงินและเงินเดือน","การทำงานและเจ้านาย","ความรักและความสัมพันธ์","ความขี้เกียจและการนอน","ชีวิตประจำวัน","อาหารและความหิว","โซเชียลมีเดียและมือถือ","ฝนตกและสภาพอากาศ","เพื่อนและแก๊งค์","ครอบครัวและพ่อแม่","รถติดและการเดินทาง","สุขภาพและการออกกำลังกาย","ความฝันและอนาคต","การเรียนและการสอบ","ไวไฟและเทคโนโลยี"];
const STYLES=["ประชดเบาๆ","เปรียบเทียบขำๆ","ถามกวนๆ","สั้นกระชับแต่แสบ","พลิกมุมให้คิดตาม","เล่าแบบเว่อร์ๆ"];
const recent=[],recentThemes=[];
const norm=t=>t.replace(/[\s.,!?…"“”]/g,"");
const seen=t=>recent.some(r=>norm(r)===norm(t));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pickTheme(){
 const pool=THEMES.filter(t=>!recentThemes.includes(t));const t=pick(pool.length?pool:THEMES);
 recentThemes.push(t);if(recentThemes.length>6)recentThemes.shift();return t;
}
function remember(t){recent.push(t);if(recent.length>12)recent.shift()}
async function callGroq(key){
 const theme=pickTheme(),style=pick(STYLES);
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
 try{
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:ac.signal,
   headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},
   body:JSON.stringify({model:"llama-3.3-70b-versatile",temperature:1.2,max_tokens:140,
    messages:[
     {role:"system",content:"คุณเป็นนักเขียนคำคมภาษาไทยสไตล์กวนๆ ฮาๆ กฎเหล็ก: 1) ตอบเป็นคำคมใหม่เพียงอันเดียว ไม่เกิน 2 ประโยค 2) ต้องเปลี่ยนธีมและมุมมองใหม่ทุกครั้ง ตามธีมที่ผู้ใช้กำหนด 3) ห้ามซ้ำหรือคล้ายมุกเดิมที่อยู่ในรายการห้าม 4) ห้ามขึ้นต้นด้วยคำเดิมซ้ำๆ 5) ไม่ใส่เครื่องหมายคำพูด ไม่อธิบายเพิ่ม"},
     {role:"user",content:"อารมณ์: "+MOODS[mood].p+"\nธีมครั้งนี้: "+theme+"\nสไตล์: "+style+"\nรหัสสุ่ม: "+Math.random().toString(36).slice(2,8)+"\nรายการห้ามซ้ำ:\n- "+(recent.slice(-8).join("\n- ")||"(ยังไม่มี)")}]})});
  if(!r.ok)throw 0;
  const t=(await r.json()).choices[0].message.content.trim().replace(/^["“]|["”]$/g,"");
  if(!t)throw 0;return t;
 }finally{clearTimeout(to)}
}
async function ai(){
 const key=ls.get("groq_key");if(!key)throw 0;
 let t=await callGroq(key);
 if(seen(t))t=await callGroq(key); /* ซ้ำ → ลองใหม่ 1 ครั้ง */
 if(seen(t))throw 0; /* ยังซ้ำ → ใช้คำคมสำรอง */
 return t;
}
function mock(){
 const a=MOCK[mood];
 let pool=a.filter(q=>!seen(q));
 if(!pool.length)pool=a.filter(q=>norm(q)!==norm(last)); /* ใช้หมดแล้ว → วนใหม่แต่ไม่ซ้ำล่าสุด */
 return pick(pool.length?pool:a);
}

/* broken heart */
function heartPop(){
 const c=$("card"),h=document.createElement("div");h.className="hp";h.textContent="💔";c.appendChild(h);setTimeout(()=>h.remove(),1500);
 for(let i=0;i<7;i++){
  const e=document.createElement("div");e.className="sh";e.textContent=i%2?"💔":"🩷";
  const a=i/7*Math.PI*2;e.style.cssText+=`--x:${Math.cos(a)*55}px;--y:${Math.sin(a)*40-40}px;--r:${(i-3)*40}deg`;
  c.appendChild(e);setTimeout(()=>e.remove(),1400);
 }
}

/* roll */
function syncFav(){const on=favs.some(f=>f.t===cur);$("fav").textContent=on?"❤️":"🤍";$("fav").classList.toggle("on",on);$("fc").textContent=favs.length}
async function roll(){
 if(busy)return;busy=true;speechSynthesis?.cancel?.();
 const q=$("q"),all=MOCK.random;q.classList.add("slot");
 const iv=setInterval(()=>{q.textContent=all[Math.floor(Math.random()*all.length)]},80);
 const wait=new Promise(r=>setTimeout(r,1000));
 let res;try{res=await ai()}catch{res=mock()}
 await wait;clearInterval(iv);
 q.textContent=res;cur=last=res;remember(res);q.classList.remove("slot");busy=false;syncFav();
 if(mood==="broken")heartPop();
}
$("go").onclick=roll;

/* copy */
function needQ(){if(!cur){toast("🎲 สุ่มคำคมก่อนนะ");return false}return true}
$("copy").onclick=async()=>{
 if(!needQ())return;
 try{await navigator.clipboard.writeText(cur)}catch{const t=document.createElement("textarea");t.value=cur;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
 toast("✅ คัดลอกคำคมแล้ว");
};

/* share */
const shareText=()=>cur+"\n— Quote Vibe AI ✨";
$("line").onclick=()=>{if(needQ())window.open("https://line.me/R/msg/text/?"+encodeURIComponent(shareText()),"_blank","noopener")};
$("tw").onclick=()=>{if(needQ())window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText()),"_blank","noopener")};

/* TTS */
$("tts").onclick=()=>{
 if(!needQ())return;
 if(!("speechSynthesis" in window)){toast("เบราว์เซอร์นี้ไม่รองรับการอ่านเสียง");return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur);u.lang="th-TH";u.rate=.95;speechSynthesis.speak(u);toast("🔊 กำลังอ่านออกเสียง");
};

/* favorites */
$("fav").onclick=()=>{
 if(!needQ())return;
 const i=favs.findIndex(f=>f.t===cur);
 if(i>=0){favs.splice(i,1);toast("เอาออกจากรายการโปรดแล้ว")}else{favs.unshift({t:cur,m:mood});toast("⭐ บันทึกคำคมโปรดแล้ว")}
 ls.set("qv_favs",JSON.stringify(favs));syncFav();
};
$("favs").onclick=()=>{
 const l=$("favList");l.innerHTML="";
 if(!favs.length)l.innerHTML='<p class="text-sm opacity-60 text-center py-6">ยังไม่มีคำคมโปรด กดปุ่ม 🤍 เพื่อบันทึก</p>';
 favs.forEach((f,i)=>{
  const d=document.createElement("div");d.className="glass rounded-2xl p-3 text-sm";
  d.innerHTML=`<div class="opacity-60 text-xs mb-1">${MOODS[f.m]?.n||""}</div><div></div><div class="flex gap-2 mt-2"><button class="pb flex-1 !py-2">ใช้การ์ดนี้</button><button class="pb !py-2">🗑️</button></div>`;
  d.children[1].textContent=f.t;
  const [u,x]=d.querySelectorAll("button");
  u.onclick=()=>{cur=last=f.t;$("q").textContent=f.t;syncFav();dFav.close()};
  x.onclick=()=>{favs.splice(i,1);ls.set("qv_favs",JSON.stringify(favs));syncFav();$("favs").onclick()};
  l.appendChild(d);
 });
 dFav.showModal();
};

/* story card */
function wrap(ctx,text,max){
 const seg=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter("th",{granularity:"word"}).segment(text)].map(s=>s.segment):[...text];
 const lines=[];let line="";
 seg.forEach(w=>{if(ctx.measureText(line+w).width>max&&line){lines.push(line.trim());line=w}else line+=w});
 if(line.trim())lines.push(line.trim());return lines;
}
$("story").onclick=()=>{
 if(!needQ())return;
 const c=$("cv"),x=c.getContext("2d"),ac=MOODS[mood].c;
 const g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,"#0b0b16");g.addColorStop(.5,"#16132b");g.addColorStop(1,"#0b0b16");x.fillStyle=g;x.fillRect(0,0,1080,1920);
 [[220,360,420,ac],[900,1500,480,"#6d5dfc"]].forEach(([cx,cy,r,col])=>{const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,col+"88");rg.addColorStop(1,col+"00");x.fillStyle=rg;x.fillRect(0,0,1080,1920)});
 x.fillStyle="rgba(255,255,255,.09)";x.strokeStyle="rgba(255,255,255,.2)";x.lineWidth=3;
 x.beginPath();x.roundRect(90,520,900,880,70);x.fill();x.stroke();
 const font='"Sarabun","Noto Sans Thai",system-ui,sans-serif';
 x.textAlign="center";x.fillStyle="#fff";x.font="700 64px "+font;
 const lines=wrap(x,cur,780),lh=108,y0=960-(lines.length-1)*lh/2;
 lines.forEach((l,i)=>x.fillText(l,540,y0+i*lh));
 x.font="500 38px "+font;x.fillStyle=ac;x.fillText(MOODS[mood].n,540,620);
 x.fillStyle="rgba(255,255,255,.65)";x.font="600 40px "+font;x.fillText("✨ Quote Vibe AI",540,1300);
 dStory.showModal();
};
$("dl").onclick=()=>{$("cv").toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="quote-vibe-story.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("⬇️ บันทึกรูปแล้ว")})};

/* settings */
$("gear").onclick=()=>{$("key").value=ls.get("groq_key")||"";dKey.showModal()};
$("saveKey").onclick=()=>{const v=$("key").value.trim();v?ls.set("groq_key",v):ls.del("groq_key");dKey.close();toast(v?"🔑 บันทึก key แล้ว":"ใช้คำคมสำรองออฟไลน์")};
syncFav();
</script>
